name: 🚀 编译 immortalwrt(Build immortalwrt)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "openWRT 仓库的拥有者 (Owner of openWRT repo)"
        type: string
        required: true
        default: "immortalwrt"
      repo:
        description: "openWRT 仓库的名字 (Name of openWRT repo)"
        type: string
        required: true
        default: "immortalwrt"
      branch:
        description: "openWRT 仓库的分支 (Branch of openWRT repo)"
        type: string
        required: true
        default: "openwrt-24.10"
      multithreading:
        description: "开启多线程编译 (Enable multithreading build)"
        type: boolean
        default: true
      ssh:
        description: "使用 ssh 连接到编译环境 (Connect to the build environment using ssh)"
        type: boolean
        default: false
      isFiles:
        description: "使用files大法 (Whether to upload the etc files)"
        type: boolean
        default: false
      skip_download:
        description: "是否跳过 make download（跳过可显著节省磁盘空间，但可能导致编译时现场下载失败）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    env:
      DOWNLOAD_MIRROR: "https://mirrors.tuna.tsinghua.edu.cn/openwrt;https://mirrors.aliyun.com/openwrt;https://mirrors.nju.edu.cn/openwrt"
    steps:
      - name: 打印编译环境硬件配置 (Print runner hardware info)
        run: |
          echo "===== CPU ====="
          echo "核数: $(nproc)"
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread|Core|Socket|MHz" || true
          echo "===== 内存 ====="
          free -h
          echo "===== 磁盘 ====="
          df -h / | cat
          echo "===== 系统 ====="
          uname -a
          echo "===== 编译器 ====="
          gcc --version | head -1 || true
          g++ --version | head -1 || true

      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: "Optimize Disk Space"
        uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Freeing up disk space (manual cleanup)
        run: |
          # 初始已有 80G+ 可用，仅做保守清理，避免 maximize-build-space 把根分区搞满
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /usr/local/.ghcup 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h / | tail -1

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: 检查可用磁盘空间 (Abort if insufficient free space)
        run: |
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          avail_gb=$((avail_kb/1024/1024))
          echo "Available disk space: ${avail_gb} GB"
          min_gb=8
          if [ -z "$avail_kb" ] || [ "$avail_gb" -lt "$min_gb" ]; then
            echo "错误: 可用磁盘不足（${avail_gb}GB < ${min_gb}GB），中止编译。"
            exit 1
          fi

      - name: 预清理 openWRT 临时目录（如存在）
        if: always()
        run: |
          echo "清理 openWRT/dl、openWRT/build_dir、openWRT/staging_dir（如存在）以释放空间"
          rm -rf openWRT/dl openWRT/build_dir openWRT/staging_dir || true

      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          sudo apt update
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 openWRT 仓库 (Clone openWRT repo)
        uses: actions/checkout@v4
        with:
          repository: "${{inputs.owner}}/${{inputs.repo}}"
          ref: ${{inputs.branch}}
          path: openWRT

      - name: 复制当前仓库的配置文件到 openWRT 仓库  (Copy current repo config to openWRT repo)
        run: cp -f .config diy.sh openWRT/

      - name: 如果选择了上传 files 大法，则复制 files 目录到 openWRT 仓库 (If you choose to upload the etc files, copy the etc directory to the openWRT repo)
        if: ${{inputs.isFiles == true}}
        run: cp -r files openWRT/files

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: openWRT
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: openWRT
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 使用ssh连接编译环境，限时15分钟，可在连接后输入命令 `touch /tmp/keepalive` 保活 (Connect to the build environment using ssh)
        if: ${{inputs.ssh == true}}
        uses: csexton/debugger-action@master

      - name: 启用ssh生成了.config后在编译前上传配置(Upload config before build)
        if: ${{inputs.multithreading == true}}
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            openWRT/.config
            openWRT/feeds.conf.default
          include-hidden-files: true

      - name: 预下载源码包 (Pre-download packages, retry up to 3 times)
        if: ${{inputs.skip_download == false}}
        working-directory: openWRT
        run: |
          for i in 1 2 3; do
            echo "===== make download 第 $i 次尝试 ====="
            make download -j$(nproc) V=s && break
            echo "===== 第 $i 次下载失败，重试... ====="
          done

      - name: 多线程编译 openWRT (Build openWRT multithreading)
        if: ${{inputs.multithreading == true}}
        working-directory: openWRT
        run: make -j$(nproc) V=s

      - name: 单线程编译 openWRT (Build openWRT single thread)
        if: ${{inputs.multithreading == false}}
        working-directory: openWRT
        run: make -j1 V=s

      - name: 诊断磁盘占用 (Diagnose disk usage)
        if: ${{always()}}
        working-directory: openWRT
        run: |
          echo "===== 磁盘总览 ====="
          df -hT / | cat
          echo "===== 关键目录占用 ====="
          du -sh dl build_dir staging_dir bin tmp 2>/dev/null || true
          echo "===== openWRT 目录占用 Top 15 ====="
          du -h --max-depth=2 . 2>/dev/null | sort -rh | head -15 || true

      - name: 清理编译临时目录以释放空间
        if: ${{always()}}
        working-directory: openWRT
        run: |
          echo "Removing dl, build_dir, staging_dir to free space before packaging"
          rm -rf dl build_dir staging_dir || true

      - name: 打包构建产物 (Package build artifacts)
        if: ${{always()}}
        working-directory: openWRT
        run: |
          if [ -d bin/targets ]; then
            echo "Packaging bin/targets into openwrt-bin-targets.tar.xz"
            tar -cJf openwrt-bin-targets.tar.xz -C bin/targets .
            ls -lh openwrt-bin-targets.tar.xz || true
          else
            echo "No bin/targets found to package"
          fi

      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: openWRT-build-result
          path: openWRT/openwrt-bin-targets.tar.xz
